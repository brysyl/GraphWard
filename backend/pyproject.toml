[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "graphward-backend"
version = "1.0.0"
description = "GraphWard AI — Autonomous Code Remediation Platform (Backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "networkx==3.3",
    "pytest==8.2.0",
    "pytest-timeout==2.3.1",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.10.0",
    "ruff==0.4.4",
    "pytest-cov==5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
